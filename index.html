<!DOCTYPE html>
<html>
<head>
  <title>Scan Retur</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<h3>Scan Retur</h3>

<label>Tanggal:</label>
<input type="date" id="tanggal"><br><br>

<h2>Total Scan: <span id="counter">0</span></h2>

<button onclick="startAll()">Mulai Scan</button>

<div id="reader" style="width:300px; margin-top:20px;"></div>

<script>
const tanggal = document.getElementById("tanggal");
tanggal.value = new Date().toISOString().split('T')[0];

let scanner;
let count = 0;
let lastScan = "";
let lastTime = 0;
let audioCtx = null;

// 🔊 init audio sekali
function initBeep() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

// 🔊 bunyi beep
function beep() {
  if (!audioCtx) return;

  let oscillator = audioCtx.createOscillator();
  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime);
  oscillator.connect(audioCtx.destination);
  oscillator.start();
  oscillator.stop(audioCtx.currentTime + 0.1);
}

// update counter
function updateCounter() {
  document.getElementById("counter").innerText = count;
}

// start semua
function startAll() {
  initBeep();
  startScanner();
}

function startScanner() {
  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => {

      let now = Date.now();

      // 🚫 anti double cepat (barcode sama dalam 2 detik)
      if (decodedText === lastScan && (now - lastTime) < 2000) {
        return;
      }

      lastScan = decodedText;
      lastTime = now;

      scanner.stop().then(() => {

        fetch(`https://script.google.com/macros/s/AKfycbwkn6XaWmxnEVgADstmplU4NbjqZ1EChqL1Xy26DnF9Wb0AMI7rLydzXfANkNh1O5FF/exec?tanggal=${tanggal.value}&resi=${decodedText}`)
        .then(() => {

          // 🔊 bunyi
          beep();

          // ➕ counter
          count++;
          updateCounter();

          // 🔁 lanjut scan lagi (delay biar stabil)
          setTimeout(() => {
            startScanner();
          }, 800);

        });

      });

    }
  ).catch(err => {
    alert("Kamera error: " + err);
  });
}
</script>

</body>
</html>
