<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<title>Scan Retur</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  margin: 0;
  padding: 10px;
  font-family: Arial;
  text-align: center;
}

#reader {
  width: 100% !important;
  max-width: 400px;
  margin: auto;
}

button {
  width: 90%;
  padding: 15px;
  font-size: 18px;
  margin-top: 10px;
}

input {
  width: 90%;
  padding: 10px;
  font-size: 16px;
}
</style>
</head>

<body>

<h3>Scan Retur</h3>

<!-- ❗ sekarang cuma display aja, gak dikirim ke server -->
<label>Tanggal:</label>
<input type="date" id="tanggal"><br><br>

<h2>Total Scan: <span id="counter">0</span></h2>

<button onclick="startAll()">Mulai Scan</button>

<div id="reader" style="margin-top:20px;"></div>

<script>
const tanggal = document.getElementById("tanggal");

// tampilkan tanggal hari ini (WIB)
function getToday() {
  let now = new Date();
  let y = now.getFullYear();
  let m = String(now.getMonth() + 1).padStart(2, '0');
  let d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

tanggal.value = getToday();

// counter
let count = parseInt(localStorage.getItem("count")) || 0;
document.getElementById("counter").innerText = count;

// variabel
let scanner;
let lastScan = "";
let lastTime = 0;
let audioCtx = null;

// 🔊 init audio
function initBeep() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

// 🔊 beep
function beep() {
  if (!audioCtx) return;

  let osc = audioCtx.createOscillator();
  osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
  osc.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.08);
}

// update counter
function updateCounter() {
  document.getElementById("counter").innerText = count;
}

// start semua
function startAll() {
  initBeep();
  startScanner();
}

// scanner
function startScanner() {
  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 15, qrbox: 250 },
    (decodedText) => {

      let now = Date.now();

      // anti double scan
      if (decodedText === lastScan && (now - lastTime) < 1200) return;

      lastScan = decodedText;
      lastTime = now;

      // beep
      beep();

      // counter
      count++;
      localStorage.setItem("count", count);
      updateCounter();

      // 🔥 kirim ke server (TANPA tanggal)
      fetch(`https://script.google.com/macros/s/AKfycbwJgYEfppFQEGGhrLL7MZ3yNZI9v5Q3d4mOVPl4736Yfczdd_Gj_F6hf8JokY3pxoJiwA/exec?resi=${encodeURIComponent(decodedText)}`)
      .catch(err => console.log(err));
    }
  ).catch(err => {
    alert("Kamera error: " + err);
  });
}
</script>

</body>
</html>
