<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
  <title>Scan Retur</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
  <style>
body {
  margin: 0;
  padding: 10px;
  font-family: Arial;
  text-align: center;
}

#reader {
  width: 100% !important;
  max-width: 400px;
  margin: auto;
}

button {
  width: 90%;
  padding: 15px;
  font-size: 18px;
  margin-top: 10px;
}

input {
  width: 90%;
  padding: 10px;
  font-size: 16px;
}
</style>
<body>

<h3>Scan Retur</h3>

<label>Tanggal:</label>
<input type="date" id="tanggal"><br><br>

<h2>Total Scan: <span id="counter">0</span></h2>

<button onclick="startAll()">Mulai Scan</button>

<div id="reader" style="width:300px; margin-top:20px;"></div>

<script>
function checkDateChange() {
  if (tanggal.value !== currentDate) {
    currentDate = tanggal.value;
    count = 0;
    localStorage.setItem("count", 0);
    updateCounter();
  }
}

const tanggal = document.getElementById("tanggal");
function getToday() {
  let now = new Date();

  let year = now.getFullYear();
  let month = String(now.getMonth() + 1).padStart(2, '0');
  let day = String(now.getDate()).padStart(2, '0');

  return `${year}-${month}-${day}`;
}

tanggal.value = getToday();
console.log("Tanggal kirim:", tanggal.value);

let count = parseInt(localStorage.getItem("count")) || 0;
document.getElementById("counter").innerText = count;
let scanner;
let lastScan = "";
let lastTime = 0;
let audioCtx = null;
let currentDate = tanggal.value;

// 🔊 init audio sekali
function initBeep() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

// 🔊 beep
function beep() {
  if (!audioCtx) return;

  let osc = audioCtx.createOscillator();
  osc.type = "sine";
  osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
  osc.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.08);
}

// counter
function updateCounter() {
  document.getElementById("counter").innerText = count;
}

// start semua
function startAll() {
  initBeep();
  startScanner();
}

function startScanner() {
  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 15, qrbox: 250 }, // fps dinaikin biar responsif
    (decodedText) => {
     checkDateChange(); // 🔥 WAJIB DI SINI
      let now = Date.now();

      // 🚫 anti spam scan
      if (decodedText === lastScan && (now - lastTime) < 1500) return;

      lastScan = decodedText;
      lastTime = now;

      // 🔊 beep langsung (tanpa stop kamera)
      beep();

      // ➕ counter langsung naik
      count++;
      localStorage.setItem("count", count);
      updateCounter();

      // 🚀 kirim ke server (tanpa nunggu)
      fetch(`https://script.google.com/macros/s/AKfycbz7rVeXy3r4YpaMQ_Z0xgSHLnVBF4TnkXSL9oKOWZ0LMhCzeQxDiR36c-cP2MkR_LMyhg/exec?tanggal=${encodeURIComponent(tanggal.value)}&resi=${encodeURIComponent(decodedText)}`)
      .catch(err => console.log(err));

    }
  ).catch(err => {
    alert("Kamera error: " + err);
  });
}
</script>

</body>
</html>
